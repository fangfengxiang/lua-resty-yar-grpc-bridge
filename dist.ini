# distribution config for opm packaging
name=lua-resty-yar-grpc-bridge
abstract=gRPC to YAR protocol bridge for OpenResty, bridging gRPC clients to PHP YAR servers
version=0.1.2
author=fangfengxiang
is_original=yes
license=apache2
lib_dir=lib
doc_dir=docs
repo_link=https://github.com/fangfengxiang/lua-resty-yar-grpc-bridge
main_module=lib/resty/yar_grpc_bridge/init.lua
# luarocks 依赖（lua-yar / lua-yar-grpc / lua-protobuf）由 README 指引用户手动安装：
#   luarocks install lua-yar-grpc
# opm 暂不支持 luarocks 跨生态依赖（官方 TODO，计划 opm get luarocks/<pkg>）
requires = luajit, openresty >= 1.19.3.1
