# nginx_grpc2yar.conf — 场景2：Go gRPC client → OpenResty (forward bridge) → PHP Yar server
#
# OpenResty 监听 1984 端口（HTTP/2），接收 gRPC 请求，
# 通过 grpc2yar.lua 转换为 YAR 协议，调用 PHP Yar server（8888 端口）。
#
# 数据流：Go gRPC client → POST /Calculator/Add → OpenResty → YAR add() → PHP → 返回
#
# proto 引用：t/e2e/proto/calculator.proto → gen.sh 生成 calculator.pb
#
# 路径占位符（由 run_e2e.sh / scenario 脚本 sed 替换）：
#   @RUN@        = t/e2e/.run  （日志、pid、temp 全部在此目录）
#   @PREFIX@     = 项目根（OpenResty prefix，lib/ 相对于此）
#   @PACKAGER@   = YAR 打包器名称（json 或 msgpack，与 PHP yar.packager 一致）

worker_processes 1;
daemon off;
pid @RUN@/nginx_grpc2yar.pid;
error_log @RUN@/logs/nginx_grpc2yar_error.log info;

events {
    worker_connections 64;
}

http {
    # lib/ 目录包含 resty/yar_grpc_bridge/*.lua
    # ;; 兜底查找 luarocks 安装的 lua-yar / lua-yar-grpc / lua-protobuf（OpenResty luajit 标准路径）
    lua_package_path "@PREFIX@/lib/?.lua;@PREFIX@/lib/?/init.lua;;";
    client_body_buffer_size 2m;

    # temp 路径全部限制在 .run/ 下，避免污染项目根目录
    client_body_temp_path @RUN@/client_body_temp;
    proxy_temp_path       @RUN@/proxy_temp;
    fastcgi_temp_path     @RUN@/fastcgi_temp;

    access_log @RUN@/logs/nginx_grpc2yar_access.log;

    init_by_lua_block {
        local proxy = require("resty.yar_grpc_bridge")

        -- .pb 文件（由 gen.sh 从 t/e2e/proto/*.proto 生成）
        local calc_pb = "@PREFIX@/t/e2e/proto/calculator.pb"  -- 有 package（calculator.Calculator）
        local bare_pb = "@PREFIX@/t/e2e/proto/bare.pb"        -- 无 package（Bare）

        proxy.setup {
            services = {
                ["calculator.Calculator"] = {
                    proto = calc_pb,
                    url   = "http://127.0.0.1:@PORT_PHP@/api.php",
                    options = { packager = "@PACKAGER@", persistent = false },
                },
                ["Bare"] = {
                    proto = bare_pb,
                    url   = "http://127.0.0.1:@PORT_PHP@/bare.php",
                    options = { packager = "@PACKAGER@", persistent = false },
                },
            },
        }
    }

    server {
        listen @PORT_GRPC2YAR@;
        http2 on;
        client_max_body_size 10m;

        location / {
            # grpc-status/grpc-message 作为 HTTP/2 trailers 发送
            # lua 通过 ngx.var.grpc_status 设置值，add_trailer 在 body filter 阶段输出
            set $grpc_status "0";
            set $grpc_message "";
            add_trailer grpc-status $grpc_status always;
            add_trailer grpc-message $grpc_message always;
            content_by_lua_block { require("resty.yar_grpc_bridge").serve() }
            log_by_lua_block { require("resty.yar_grpc_bridge").log_phase() }
        }
    }
}
