# nginx_yar2grpc.conf — 场景1：PHP Yar client → OpenResty (reverse bridge) → Go gRPC server
#
# OpenResty 监听 1985 端口（HTTP/1.1），接收 YAR 请求，
# 通过 yar2grpc.lua 转换为 gRPC 调用，通过 proxy_pass 转发到
# Go gRPC server 的 HTTP bridge 端点（50052 端口）。
#
# 数据流：PHP Yar client → POST /api.php → OpenResty → gRPC Add() → Go → 返回
#
# proto 引用：t/e2e/proto/calculator.proto → gen.sh 生成 calculator.pb
#
# 架构决策：使用 proxy_pass（HTTP/1.1）而非 grpc_pass（HTTP/2）
#   原因：ngx.location.capture 创建 HTTP/1.1 子请求，与 grpc_pass 的 HTTP/2
#   要求不兼容。Go server 同时提供 HTTP bridge 端点（50052），接收 gRPC 帧
#   格式的 HTTP POST，内部调用 gRPC 方法，返回 gRPC 帧响应。
#
# 路径占位符（由 run_e2e.sh / scenario 脚本 sed 替换）：
#   @RUN@        = t/e2e/.run  （日志、pid、temp 全部在此目录）
#   @PREFIX@     = 项目根（OpenResty prefix，lib/ 相对于此）

worker_processes 1;
daemon off;
pid @RUN@/nginx_yar2grpc.pid;
error_log @RUN@/logs/nginx_yar2grpc_error.log info;

events {
    worker_connections 64;
}

http {
    # ;; 兜底查找 luarocks 安装的 lua-yar / lua-yar-grpc / lua-protobuf（OpenResty luajit 标准路径）
    lua_package_path "@PREFIX@/lib/?.lua;@PREFIX@/lib/?/init.lua;;";
    client_body_buffer_size 2m;

    # temp 路径全部限制在 .run/ 下，避免污染项目根目录
    client_body_temp_path @RUN@/client_body_temp;
    proxy_temp_path       @RUN@/proxy_temp;
    fastcgi_temp_path     @RUN@/fastcgi_temp;

    access_log @RUN@/logs/nginx_yar2grpc_access.log;

    init_by_lua_block {
        local pb = require("pb")

        -- 加载 .pb 文件（由 gen.sh 从 t/e2e/proto/*.proto 生成）
        -- calculator.pb：有 package（calculator.Calculator）
        -- bare.pb：无 package（Bare），验证 fullServiceName 无 package 模式
        for _, f in ipairs({
            "@PREFIX@/t/e2e/proto/calculator.pb",
            "@PREFIX@/t/e2e/proto/bare.pb",
        }) do
            local ok, err = pb.loadfile(f)
            if not ok then
                error("failed to load proto " .. f .. ": " .. tostring(err))
            end
        end

        -- 配置反向桥接
        local rb = require("resty.yar_grpc_bridge.yar2grpc")
        rb.setup {
            services = {
                ["calculator.Calculator"] = {
                    methods = {"Add", "Subtract"},
                },
                ["Bare"] = {
                    methods = {"Combine"},
                },
            },
            grpc_transport = function(service, method, frame)
                local res = ngx.location.capture("/grpc_backend/" .. service .. "/" .. method, {
                    method = ngx.HTTP_POST,
                    body = frame,
                })
                if res.status ~= 200 then
                    return nil, 14, "gRPC backend HTTP error: " .. res.status
                end
                local grpc_status = tonumber(res.header["grpc-status"]) or 0
                if grpc_status ~= 0 then
                    return nil, grpc_status, res.header["grpc-message"] or "gRPC error"
                end
                return res.body
            end,
        }
    }

    server {
        listen @PORT_YAR2GRPC@;
        client_max_body_size 10m;

        # YAR endpoint — nginx location 用 named capture 提取 path 末段为 service_name 变量
        # 前缀由部署方决定（示例用 /api/）；lua 端读 ngx.var.service_name 不做 path 解析
        # PHP Yar client: new Yar_Client("http://127.0.0.1:1985/api/calculator.Calculator")
        location ~ ^/api/(?<service_name>[^/]+)$ {
            content_by_lua_block { require("resty.yar_grpc_bridge.yar2grpc").handle() }
        }

        # Internal HTTP upstream — proxy_pass 到 Go HTTP bridge (50052)
        location ~ ^/grpc_backend/([^/]+)/([^/]+)$ {
            internal;
            rewrite ^/grpc_backend/([^/]+)/([^/]+)$ /$1/$2 break;
            proxy_set_header Content-Type application/grpc;
            proxy_set_header TE trailers;
            proxy_pass http://127.0.0.1:@PORT_GO_HTTP@;
        }
    }
}
