# gRPC → YAR 方向 nginx location 示例
# 直接 include 或复制到 server { } 块内。
#
# path 解析在 Lua 层（host.var.uri + grpc_converter.parse_grpc_path），nginx 用
# location / 兜底：
#   - 部署方无需手写正则，零配置负担
#   - 不匹配的 path 在 Lua 层返回 gRPC INVALID_ARGUMENT(3)，保留错误码语义
#   - bridge 不依赖 nginx named capture 变量名，解耦

location / {
    content_by_lua_block {
        require("resty.yar_grpc_bridge").serve()
    }

    # access-log phase（可选，推荐）
    log_by_lua_block {
        require("resty.yar_grpc_bridge").log_phase()
    }
}
