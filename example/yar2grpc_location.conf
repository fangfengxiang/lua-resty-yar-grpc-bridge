# YAR → gRPC 方向 nginx location 示例
# 直接 include 或复制到 server { } 块内。
#
# named capture 提取 service_name：
#   - [^/]+ 兼容含 package 的 fullServiceName（如 calc.Calculator，"." 不影响匹配）
#   - PHP YAR client 指向 http://host:port/{Service}，如 http://host:8888/Calculator
#   - path 多段（如 /_grpc/... 内部代理）不匹配此正则，自动落到前缀 location

location ~ ^/(?<service_name>[^/]+)$ {
    content_by_lua_block {
        require("resty.yar_grpc_bridge.yar2grpc").handle()
    }
}
